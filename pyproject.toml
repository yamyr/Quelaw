[project]
name = "quelaw"
version = "0.2.0"
description = "Quelaw: Singapore legal citation verification against a controlled dataset"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "anthropic>=1.3.0,<2",
    "chromadb>=1.5.9,<2",
    "pydantic>=2.10,<3",
    "python-docx>=1.2.0,<2",
    "python-dotenv>=1.2.3,<2",
    "streamlit>=1.63.0,<2",
]

[project.urls]
Repository = "https://github.com/yamyr/Quelaw"
Issues = "https://github.com/yamyr/Quelaw/issues"

[dependency-groups]
dev = [
    "markdown-it-py>=4.2,<5",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6",
]

[tool.uv]
package = false
required-version = ">=0.12.7,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
