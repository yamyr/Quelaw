name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ""
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install locked runtime and test dependencies
        run: uv sync --locked

      - name: Check deployment requirements match the lockfile
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Check installed dependencies
        run: uv pip check

      - name: Byte-compile all modules
        run: uv run --locked python -m compileall -q app.py quelaw scripts

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 app.py quelaw scripts tests

      - name: Validate source inventory
        run: uv run --locked python scripts/check_dataset.py

      - name: Evaluate offline evidence baseline
        run: >-
          uv run --locked python scripts/evaluate.py
          --dataset data/sandbox --cases data/evaluation/v1/cases.jsonl
          --baseline data/evaluation/v1/baseline.json

      - name: Run pipeline and Streamlit tests
        run: uv run --locked pytest -q

      - name: Run offline demo scenarios
        run: uv run --locked python scripts/check_demo_scenarios.py
